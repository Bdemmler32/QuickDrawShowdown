<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quick Draw">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Two-player Wild West quick-draw reaction duel for one phone or tablet.">
<title>Quick Draw Showdown</title>
<style>
:root{
  /* Layout: a portrait duel stage. Each half of the street is drawn from the rival's end so both
     gunslingers show their fronts; each player's controls sit in their own half, the top half rotated 180deg. */
  --ink:#2b1408;
  --plaque:rgba(34,16,6,.9);
  --gold:#ffc93c;
  --blue:#35b8e4;
  --red:#ff6a50;
  --cream:#fff4da;
  --zone:160px;
  --px:3px;
  /* Safe areas live in variables so every rule (and the JS layout) reads one source. */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
html{height:100%;background:#1f1208;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:auto}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:#1f1208 repeating-linear-gradient(90deg,#1f1208 0 24px,#27170b 24px 27px)}
#scrim{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) * 1.5);pointer-events:none;z-index:40;background:linear-gradient(rgba(10,4,0,.55),rgba(10,4,0,.25) 66%,rgba(10,4,0,0))}
body{
  background:#1f1208 repeating-linear-gradient(90deg,#1f1208 0 24px,#27170b 24px 27px);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--cream);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
}
#stage{
  position:absolute;top:0;height:100%;left:50%;transform:translateX(-50%);width:100%;
  overflow:hidden;touch-action:none;background:#e3b264;box-shadow:0 0 60px rgba(0,0,0,.6);
}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot{display:flex;justify-content:center;line-height:0;pointer-events:none}
.slot canvas{display:block}
.slot.empty{display:none}
.side{position:absolute;left:0;right:0;height:50%;pointer-events:none}
.side.p0{bottom:0;--acc:var(--blue);--acc-dk:#1d6f8f}
.side.p1{top:0;transform:rotate(180deg);--acc:var(--red);--acc-dk:#9c2f1f}
#stage.menu .side,#stage.menu #pauseBtn{display:none}
.zone{
  position:absolute;left:0;right:0;top:0;height:var(--zone);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--zone) * .05);padding:0 12px;box-sizing:border-box;
}
.sig.pop{animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
.sig.pop.fast{animation:popd .12s ease-out}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
@keyframes popd{from{transform:scale(.85)}to{transform:scale(1)}}
.sig.breathe{animation:breathe 1.6s steps(4) infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}
/* Pixel plaques and buttons: notched corners made from flat shadows */
.plaque{
  background:var(--plaque);padding:calc(var(--px) * 2.4) calc(var(--px) * 3.5);max-width:90%;box-sizing:border-box;
  box-shadow:0 calc(var(--px) * -1) 0 0 var(--plaque),0 var(--px) 0 0 var(--plaque),calc(var(--px) * -1) 0 0 0 var(--plaque),var(--px) 0 0 0 var(--plaque);
}
.plaque[hidden],.btn[hidden]{display:none}
.chip{box-shadow:0 calc(var(--px) * -1) 0 0 var(--acc),0 var(--px) 0 0 var(--acc),calc(var(--px) * -1) 0 0 0 var(--acc),var(--px) 0 0 0 var(--acc)}
.btn{
  --bg:var(--acc,#e2a13a);--bd:var(--ink);
  pointer-events:auto;cursor:pointer;border:0;border-radius:0;margin:var(--px);
  background:var(--bg);color:#fff;padding:calc(var(--px) * 2.6) calc(var(--px) * 7);min-width:52%;min-height:46px;
  display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:
    inset 0 calc(var(--px) * -2) 0 0 rgba(0,0,0,.28),inset 0 var(--px) 0 0 rgba(255,255,255,.42),
    inset var(--px) 0 0 0 rgba(255,255,255,.16),inset calc(var(--px) * -1) 0 0 0 rgba(0,0,0,.14),
    0 calc(var(--px) * -1) 0 0 var(--bd),0 var(--px) 0 0 var(--bd),calc(var(--px) * -1) 0 0 0 var(--bd),var(--px) 0 0 0 var(--bd),
    0 calc(var(--px) * 3) 0 0 rgba(0,0,0,.32);
}
.btn:active{transform:translateY(var(--px))}
.btn:focus-visible{outline:var(--px) solid #fff;outline-offset:calc(var(--px) * 2)}
.btn.gold{--bg:#e9a32c}
.btn.wood{--bg:#8a5a30}
.badge{
  position:absolute;left:calc(12px + max(var(--sal),var(--sar)));bottom:calc(12px + var(--safe,0px));display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--px) * 1.6);
  background:var(--plaque);padding:calc(var(--px) * 2) calc(var(--px) * 2.6);
  box-shadow:0 calc(var(--px) * -1) 0 0 var(--acc),0 var(--px) 0 0 var(--acc),calc(var(--px) * -1) 0 0 0 var(--acc),var(--px) 0 0 0 var(--acc);
}
.side.p0 .badge{--safe:var(--sab)}
.side.p1 .badge{--safe:var(--sat)}
.badge .slot{justify-content:flex-start}
.pips{display:flex;gap:calc(var(--px) * 1.3)}
.pips i{width:calc(var(--px) * 4);height:calc(var(--px) * 4);background:rgba(255,255,255,.14);box-shadow:inset calc(var(--px) * -1) calc(var(--px) * -1) 0 0 rgba(0,0,0,.35)}
.pips i.on{background:var(--acc);box-shadow:inset calc(var(--px) * -1) calc(var(--px) * -1) 0 0 rgba(0,0,0,.3),inset var(--px) var(--px) 0 0 rgba(255,255,255,.45)}
.pips i.new{animation:pip .4s steps(4)}
@keyframes pip{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.icon{
  position:absolute;top:50%;z-index:6;width:42px;height:42px;margin:0;padding:0;border:0;cursor:pointer;
  transform:translateY(-50%);background:#f6e3bd;color:var(--ink);display:grid;place-items:center;pointer-events:auto;
  box-shadow:inset -3px -3px 0 0 rgba(0,0,0,.18),inset 3px 3px 0 0 rgba(255,255,255,.6),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 6px 0 0 rgba(0,0,0,.3);
}
.icon:focus-visible{outline:3px solid #fff;outline-offset:5px}
.icon svg{width:24px;height:24px;shape-rendering:crispEdges}
#pauseBtn{left:calc(11px + var(--sal))}
#mute{right:calc(11px + var(--sar))}
#mute .off{display:none}
#mute[aria-pressed="true"] .on{display:none}
#mute[aria-pressed="true"] .off{display:block}
.overlay{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));box-sizing:border-box;
  background:linear-gradient(rgba(28,12,3,.35),rgba(28,12,3,.82) 70%);
}
.overlay[hidden]{display:none}
#rules,#pause{background:rgba(28,12,3,.94)}
.card{display:flex;flex-direction:column;align-items:center;gap:calc(var(--px) * 3.6);width:100%;max-width:440px}
.card .btn{width:80%;min-width:0}
.card .gap{height:calc(var(--px) * 3)}
.panel{background:var(--plaque);padding:calc(var(--px) * 5) calc(var(--px) * 5);width:88%;box-sizing:border-box;
  box-shadow:0 calc(var(--px) * -1) 0 0 #e9a32c,0 var(--px) 0 0 #e9a32c,calc(var(--px) * -1) 0 0 0 #e9a32c,var(--px) 0 0 0 #e9a32c}
.panel .slot{justify-content:flex-start}
/* Update banner: hidden with visibility, never just moved off by its own height */
.upd{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:calc(var(--px) * 3);max-width:none;white-space:nowrap;visibility:hidden;pointer-events:none}
.upd.show{visibility:visible}
.upd .btn{min-width:0;min-height:36px;padding:calc(var(--px) * 1.6) calc(var(--px) * 4);pointer-events:auto}
.upd:not(.show) .btn{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sig.pop,.sig.pop.fast,.sig.breathe,.pips i.new{animation:none}}
</style>
</head>
<body>
<div id="app">
<div id="stage" class="menu">
  <canvas id="scene" aria-label="Two voxel gunslingers face each other on a dusty Western street"></canvas>

  <div class="side p1" data-p="1">
    <div class="zone">
      <div class="slot sig"></div>
      <div class="plaque sub" hidden><div class="slot"></div></div>
      <button class="btn" type="button" data-act="ready" data-p="1" aria-label="Redbeard ready"><span class="slot"></span></button>
      <button class="btn" type="button" data-act="rematch" data-p="1" aria-label="Rematch" hidden><span class="slot"></span></button>
      <div class="plaque chip" hidden><div class="slot"></div></div>
    </div>
    <div class="badge"><div class="slot name"></div><div class="pips"></div></div>
  </div>

  <div class="side p0" data-p="0">
    <div class="zone">
      <div class="slot sig"></div>
      <div class="plaque sub" hidden><div class="slot"></div></div>
      <button class="btn" type="button" data-act="ready" data-p="0" aria-label="Bandana ready"><span class="slot"></span></button>
      <button class="btn" type="button" data-act="rematch" data-p="0" aria-label="Rematch" hidden><span class="slot"></span></button>
      <div class="plaque chip" hidden><div class="slot"></div></div>
    </div>
    <div class="badge"><div class="slot name"></div><div class="pips"></div></div>
  </div>

  <button id="pauseBtn" class="icon" type="button" data-act="pause" aria-label="Pause and menu">
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="2" fill="currentColor"/><rect x="2" y="5" width="8" height="2" fill="currentColor"/><rect x="2" y="8" width="8" height="2" fill="currentColor"/></svg>
  </button>
  <button id="mute" class="icon" type="button" data-act="sound" aria-pressed="false" aria-label="Mute sound">
    <svg class="on" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="4" width="1" height="4" fill="currentColor"/><rect x="9" y="2" width="1" height="8" fill="currentColor"/></svg>
    <svg class="off" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="4" width="1" height="1" fill="currentColor"/><rect x="8" y="5" width="1" height="2" fill="currentColor"/><rect x="9" y="7" width="1" height="1" fill="currentColor"/><rect x="9" y="4" width="1" height="1" fill="currentColor"/><rect x="7" y="7" width="1" height="1" fill="currentColor"/></svg>
  </button>

  <div id="menu" class="overlay">
    <div class="card">
      <div class="slot" id="logo1"></div>
      <div class="slot" id="logo2"></div>
      <div class="gap"></div>
      <button class="btn gold" type="button" data-act="play" aria-label="Play"><span class="slot"></span></button>
      <button class="btn wood" type="button" data-act="target" id="targetBtn"><span class="slot"></span></button>
      <button class="btn wood" type="button" data-act="rules" aria-label="How to play"><span class="slot"></span></button>
      <button class="btn wood" type="button" data-act="sound" id="menuSound"><span class="slot"></span></button>
      <div class="gap"></div>
      <div class="slot" id="menuNote"></div>
      <div class="slot" id="menuVer"></div>
    </div>
  </div>

  <div id="rules" class="overlay" hidden>
    <div class="card">
      <div class="slot" id="rulesTitle"></div>
      <div class="panel"><div class="slot" id="rulesText"></div></div>
      <button class="btn gold" type="button" data-act="rulesClose" aria-label="Got it"><span class="slot"></span></button>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="card">
      <div class="slot" id="pauseTitle"></div>
      <div class="slot" id="pauseNote"></div>
      <div class="gap"></div>
      <button class="btn gold" type="button" data-act="resume" aria-label="Resume"><span class="slot"></span></button>
      <button class="btn wood" type="button" data-act="sound" id="pauseSound"><span class="slot"></span></button>
      <button class="btn wood" type="button" data-act="quit" aria-label="Main menu"><span class="slot"></span></button>
      <div class="gap"></div>
      <div class="slot" id="pauseVer"></div>
    </div>
  </div>
  <div id="updBanner" class="plaque upd" aria-hidden="true">
    <div class="slot" id="updText"></div>
    <button class="btn gold" type="button" data-act="update" aria-label="Update to the new version"><span class="slot"></span></button>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<div id="scrim" aria-hidden="true"></div>
</div>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const APP_VERSION = '0.01';      // keep in step with VERSION in sw.js
const K = 0.56, V = 0.84;        // projection: ground depth and height
const TIE_MS = 20, NO_SHOT_MS = 5000, LOCK_MS = 1150;
const stage = document.getElementById('stage');
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 390, H = 844, DPR = 1, S = 4, FY = 200, CX = 195, ZONE = 160;
const MET = {};
const rand = (a,b) => a + Math.random()*(b-a);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = t => t*t*(3-2*t);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash3 = (x,y,z) => (((x*73856093) ^ (y*19349663) ^ (z*83492791)) >>> 0);

/* ================= colour ================= */
const RGB = new Map();
function rgbOf(h){ let v = RGB.get(h); if (!v){ const n = parseInt(h.slice(1),16); v = [n>>16&255, n>>8&255, n&255]; RGB.set(h,v); } return v; }
const CS = new Map();
function cs(h, f, warm){
  const q = Math.round(f*48), key = h + q + (warm ? 'w' : '');
  let s = CS.get(key); if (s) return s;
  const c = rgbOf(h), fr = q/48;
  let r = c[0]*fr, g = c[1]*fr, b = c[2]*fr;
  if (warm){ r += 12; g += 7; b -= 2; }
  s = `rgb(${Math.max(0,Math.min(255,r|0))},${Math.max(0,Math.min(255,g|0))},${Math.max(0,Math.min(255,b|0))})`;
  CS.set(key, s); return s;
}
function mixHex(a, b, t){ const A = rgbOf(a), B = rgbOf(b); return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`; }
function grad3(stops, t){ return t < .5 ? mixHex(stops[0], stops[1], t*2) : mixHex(stops[1], stops[2], (t-.5)*2); }

/* ================= voxel engine =================
   Voxel (x,y,z): x across, y toward the camera, z up. The camera looks down at the street from one end,
   so each voxel shows its top face and its front face. */
const DY = 512, DZ = 262144;
const VK = (x,y,z) => (x+256) + (y+256)*DY + (z+64)*DZ;
function unVK(k){ const zz = Math.floor(k/DZ), r = k - zz*DZ, yy = Math.floor(r/DY); return [r - yy*DY - 256, yy - 256, zz - 64]; }
const EMIT = new Set(['#ffd27a','#fff1b8']);

function collect(M, zmin, zmax){
  const L = [];
  for (const [k,c] of M){
    const p = unVK(k), z = p[2];
    if (z < zmin || z > zmax) continue;
    const top = !M.has(k+DZ), front = !M.has(k+DY);
    if (!top && !front) continue;
    L.push({x:p[0], y:p[1], z, k, c, top, front});
  }
  L.sort((a,b) => a.y - b.y || a.z - b.z || a.x - b.x);
  return L;
}
function drawVox(g, M, L, OX, OY, sd){
  const sw = Math.max(1, Math.round(sd*.17));
  for (const v of L){
    const {x,y,z,k,c} = v;
    const j = 1 + ((hash3(x,y,z) % 9) - 4)*.012;
    const X0 = Math.round(OX + x*sd), X1 = Math.round(OX + (x+1)*sd), w = X1 - X0;
    if (w <= 0) continue;
    const yt0 = Math.round(OY + (y*K - (z+1)*V)*sd), yt1 = Math.round(OY + ((y+1)*K - (z+1)*V)*sd), yf1 = Math.round(OY + ((y+1)*K - z*V)*sd);
    const em = EMIT.has(c);
    if (v.top && yt1 > yt0){
      let f = 1.12*j;
      if (em) f = 1.06;
      else { if (M.has(k - DY + DZ)) f *= .8; if (M.has(k - 1 + DZ)) f *= .92; if (M.has(k + 1 + DZ)) f *= .92; }
      g.fillStyle = cs(c, f, !em); g.fillRect(X0, yt0, w, yt1 - yt0);
      if (v.front && !em){ g.fillStyle = cs(c, f*1.12, true); g.fillRect(X0, yt1 - sw, w, sw); }
    }
    if (v.front && yf1 > yt1){
      let f = .86*j;
      if (em) f = 1; else if (M.has(k + DY - DZ)) f *= .82;
      g.fillStyle = cs(c, f, false); g.fillRect(X0, yt1, w, yf1 - yt1);
      if (!em){
        if (!M.has(k-1)){ g.fillStyle = cs(c, f*1.12, false); g.fillRect(X0, yt1, sw, yf1 - yt1); }
        if (!M.has(k+1)){ g.fillStyle = cs(c, f*.76, false); g.fillRect(X1 - sw, yt1, sw, yf1 - yt1); }
      }
    }
  }
}
const SUN_A = .55, SUN_B = .75;   // shadow offset per unit height (x, depth)
function spriteOf(M, sd, withShadow){
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,mnz=1e9,mxz=-1e9;
  for (const k of M.keys()){ const [x,y,z] = unVK(k); if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; if(z<mnz)mnz=z; if(z>mxz)mxz=z; }
  const left = Math.floor(mnx*sd) - 2, right = Math.ceil((mxx+1)*sd) + 2;
  const top = Math.floor((mny*K - (mxz+1)*V)*sd) - 2, bot = Math.ceil(((mxy+1)*K - mnz*V)*sd) + 2;
  const c = document.createElement('canvas'); c.width = right - left; c.height = bot - top;
  drawVox(c.getContext('2d'), M, collect(M,-64,999), -left, -top, sd);
  const spr = {c, ox:-left, oy:-top};
  if (withShadow){
    const sl = Math.floor(mnx*sd) - 6, sr = Math.ceil((mxx + 2 + mxz*SUN_A)*sd) + 6;
    const st = Math.floor(mny*K*sd) - 6, sb = Math.ceil((mxy + 2 + mxz*SUN_B)*K*sd) + 6;
    const sc = document.createElement('canvas'); sc.width = sr - sl; sc.height = sb - st;
    const sg = sc.getContext('2d'); sg.fillStyle = '#000';
    const rw = Math.ceil(sd*(1+SUN_A)) + 1, rh = Math.ceil(K*sd*(1+SUN_B)) + 1;
    for (const k of M.keys()){
      const [x,y,z] = unVK(k);
      sg.fillRect(Math.floor((x + z*SUN_A)*sd) - sl, Math.floor((y + z*SUN_B)*K*sd) - st, rw, rh);
    }
    const bc = document.createElement('canvas'); bc.width = sc.width; bc.height = sc.height;
    const bg2 = bc.getContext('2d');
    try { bg2.filter = `blur(${Math.max(1, sd*.45)}px)`; } catch(e){}
    bg2.drawImage(sc, 0, 0);
    spr.sh = bc; spr.sox = -sl; spr.soy = -st;
  }
  return spr;
}
/* Rotate a model backwards about the x axis (for falling over); inverse-sampled so there are no holes. */
function rotX(M, ang, py){
  let mnx=1e9,mxx=-1e9,mxy=-1e9,mxz=0;

/* ================= characters' state ================= */
function newCh(p){ return {p, ph:Math.random()*6.28, bob:0, crouch:0, tw:0, twAt:-1e9, nTw:0, eye:0, nEye:0, hops:[], nCheer:0}; }
function resetCh(ch){
  Object.assign(ch, {fireAt:0, fired:false, fumble:false, recAt:-1e9, holsterAt:0, hitAt:0, getUpAt:0, hatOff:false, hat:null,
    pick:null, pickReadyAt:0, cheer:false, starsUntil:0, penaltyTarget:false});

}
const CH = [newCh(0), newCh(1)];
CH.forEach(resetCh);
function legTop(P){ return (P.body === 'bend' ? 8 : 14) - P.crouch - P.bob; }
function poseOf(ch, now){
  const P = {bob:ch.bob, crouch:ch.crouch, eye:ch.eye, tw:ch.tw, arm:'idle', hat:ch.hatOff ? 0 : 1, body:'stand', dead:0};
  if (ch.hitAt){
    const t = now - ch.hitAt; let f = 0;
    if (t < 400) f = 1 + Math.min(3, Math.floor(t/100));
    else if (now < ch.getUpAt) f = 4;
    else if (now < ch.getUpAt + 360) f = 4 - Math.floor((now - ch.getUpAt)/90);
    if (f > 0){ return {bob:0, crouch:0, eye:0, tw:0, arm:'idle', hat:0, body:'f'+Math.max(1,f), dead: now < ch.getUpAt ? 1 : 0}; }
  }
  if (ch.pick){
    const t = now - ch.pick.t0;
    if (t < 320) return {bob:0, crouch:0, eye:0, tw:0, arm:'reach', hat:0, body:'bend', dead:0};
    if (t < 600) return {bob:ch.bob, crouch:0, eye:0, tw:0, arm:'up', hat:0, body:'stand', dead:0};
  }
  if (ch.fireAt && now >= ch.fireAt && !(ch.holsterAt && now > ch.holsterAt)){
    const u = now - ch.fireAt;
    P.arm = u < 40 ? 'd1' : ch.fumble ? 'fum' : (now - ch.recAt < 110 ? 'rec' : 'aim');
    P.eye = 0; P.tw = 0;
  }

}
function muzzleLocal(P){
  const Lg = legTop(P);
  if (P.arm === 'fum') return {x:-9, y:8, z:Lg-2};
  if (P.arm === 'rec') return {x:-9, y:17, z:Lg+18};

function toG(p, x, y){ return p === 1 ? {x, y} : {x: W - x, y: H - y}; }
function L2G(p, x, y, z){ return toG(p, CX + x*S, FY + y*K*S - z*V*S); }

/* ================= effects ================= */
const FX = [];
let shakeAt = -1e9, shakeAmp = 0, flashAt = -1e9;
function shake(now, amp){ if (reduceMotion) return; shakeAt = now; shakeAmp = amp; }
function particles(x,y,n,o){
  for (let i=0;i<n;i++){
    const a = o.ang != null ? o.ang + rand(-o.spread,o.spread) : rand(0,Math.PI*2), sp = rand(o.sp[0],o.sp[1]);
    FX.push({t:'p', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:o.g||0, t0:performance.now(), dur:rand(o.life[0],o.life[1]),
      s:rand(o.size[0],o.size[1]), grow:o.grow||0, col:o.cols[(Math.random()*o.cols.length)|0], drag:o.drag||0});

}
function dust(pt, n, dir){ particles(pt.x, pt.y, n, {sp:[S*8,S*26], life:[350,750], size:[S*.8,S*1.6], g:S*40*(dir||1), cols:['#f3d9a0','#e2bd7c','#d4a868','#fff0cf'], drag:2.5}); }
function smoke(pt, dir){ particles(pt.x, pt.y, 8, {ang:dir > 0 ? -Math.PI/2 : Math.PI/2, spread:1, sp:[S*2,S*7], life:[500,1000], size:[S*.9,S*1.6], grow:S*2, g:-S*5*dir, cols:['#f2ece0','#d9d2c4','#ffffff'], drag:1.5}); }

function queue(at, fn){ FX.push({t:'call', at, fn, done:false, t0:at, dur:0}); }

function doFire(ch, now){
  ch.fired = true; ch.recAt = now;
  if (ch.hitAt) return;
  Sound.shot();
  const P = poseOf(ch, now), mz = muzzleLocal(P), hz = hopZ(ch, now);
  const m = L2G(ch.p, mz.x, mz.y, mz.z + hz);
  const dir = ch.p === 1 ? 1 : -1;     // +1 = toward screen bottom
  FX.push({t:'flash', x:m.x, y:m.y, t0:now, dur:90});
  FX.push({t:'bang', x:m.x - dir*S*7, y:m.y + dir*S*2, rot:(ch.p === 1 ? 0 : Math.PI) + rand(-.18,.18), t0:now, dur:650});
  smoke(m, dir); shake(now, 5);
  ch.holsterAt = now + 1100;
  const O = G.outcome, opp = CH[1 - ch.p];
  if (ch.fumble){
    const gpt = L2G(ch.p, mz.x, mz.y + 5, 0);
    FX.push({t:'tracer', a:m, b:gpt, t0:now, dur:50});
    queue(now+50, () => dust(gpt, 16, dir));
    ch.hops.push({t:now+30, dur:380, amp:5});
    Sound.bwomp();
    return;
  }
  if (!O) return;
  if (O.type === 'false' && ch.p === O.w){
    const tgt = L2G(opp.p, 0, 0, HAT_Z + 4);
    FX.push({t:'tracer', a:m, b:tgt, t0:now, dur:70});
    queue(now+70, n => hatShot(opp, n));
  } else if (O.type === 'tie'){
    const a = L2G(0,0,0,26), b = L2G(1,0,0,26), c = {x:W/2, y:(a.y + b.y)/2};
    FX.push({t:'tracer', a:m, b:c, t0:now, dur:80});
    if (!G.sparkDone){ G.sparkDone = true; queue(now+80, n => { FX.push({t:'spark', x:c.x, y:c.y, t0:n, dur:500}); particles(c.x,c.y,18,{sp:[S*12,S*36], life:[250,550], size:[S*.5,S*1.1], g:0, cols:['#fff6c0','#ffd34d','#ffffff']}); Sound.ricochet(); }); }
  } else if (O.type === 'win' && O.w === ch.p){
    const tgt = L2G(opp.p, 0, 0, 30);
    FX.push({t:'tracer', a:m, b:tgt, t0:now, dur:70});
    queue(now+70, n => kill(opp, n));
    queue(now+600, n => ch.hops.push({t:n, dur:320, amp:3}));
  } else {
    const sd = Math.random() < .5 ? -1 : 1, tgt = L2G(opp.p, sd*rand(14,18), rand(-2,4), 0);
    FX.push({t:'tracer', a:m, b:tgt, t0:now, dur:80});

  }
}
function launchHat(ch, vy, vz){
  ch.hatOff = true;
  ch.hat = {x:0, y:0, z:HAT_Z, vx:rand(9,13)*(Math.random()<.5?-1:1), vy, vz, rot:0, vr:rand(9,15)*(Math.random()<.5?-1:1), landed:false};
}
function hatShot(ch, now){

function kill(ch, now){

const Sound = {
  ac:null, out:null, nb:null, muted:false,
  unlock(){

        this.out.connect(comp); comp.connect(this.ac.destination);

    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);

  thud(){ this.tone(110,45,.3,'sine',.6); this.noise(.25,.35,'lowpass',900,120); },
  pickup(){ this.tone(520,780,.08,'square',.06); this.tone(780,1040,.08,'square',.06,.08); },
  ready(){ this.tone(660,660,.07,'triangle',.18); this.tone(990,990,.1,'triangle',.18,.07); },

/* ================= game state ================= */
const G = { phase:'menu', paused:false, target:5, ready:[false,false], score:[0,0], rid:0, timers:[], signalTime:null, drawSetAt:0,
  shots:[null,null], outcome:null, decideT:null, resultAt:0, lockUntil:0, lateOK:false, sparkDone:false };
const active = new Map();
const keysHeld = new Set();
function clearTimers(){ G.timers.forEach(clearTimeout); G.timers = []; G.decideT = null; }
const ms = p => Math.round(G.shots[p] - G.signalTime);
const ACTIVE = () => G.phase === 'countdown' || G.phase === 'wait' || G.phase === 'draw';

function renderIdle(){
  const holding = active.size > 0 || keysHeld.size > 0;
  for (const p of [0,1]){
    if (G.ready[p]){
      showBtn(p, null); showChip(p, true);
      setSub(p, G.ready[1-p] ? (holding ? 'LIFT ALL FINGERS TO START' : '') : 'WAITING FOR YOUR RIVAL...');
    } else { showChip(p, false); showBtn(p, 'ready'); }

}
function startMatch(){
  clearTimers(); G.rid++;
  G.score = [0,0]; G.ready = [false,false]; G.outcome = null; G.phase = 'idle'; G.paused = false;
  CH.forEach(resetCh); FX.length = 0;
  $('menu').hidden = true; stage.classList.remove('menu');
  buildPips();
  bothSig('QUICK DRAW', 'mid', 'gold', {pop:true});
  for (const p of [0,1]) setSub(p, `TAP [A]READY[/]. WHEN [G]DRAW![/] APPEARS, TAP YOUR HALF FIRST. TOO SOON LOSES.`);
  renderIdle();

  announce(`New match. First to ${G.target}. Both players tap ready.`);
}
function toMenu(){
  clearTimers(); G.rid++;
  G.phase = 'menu'; G.paused = false; G.ready = [false,false];
  CH.forEach(resetCh); FX.length = 0;
  $('pause').hidden = true; $('rules').hidden = true; $('menu').hidden = false; stage.classList.add('menu');
}
function openPause(){
  if (G.phase === 'menu') return;
  setSlot($('pauseNote'), ACTIVE() ? 'THE CURRENT ROUND WAS CANCELLED. NO POINTS GIVEN.' : 'THE DUEL IS ON HOLD.', 'note');
  if (ACTIVE()){ cancelRound(); }
  else if (G.phase === 'idle'){ G.ready = [false,false]; renderIdle(); }
  G.paused = true; $('pause').hidden = false;
  active.clear(); keysHeld.clear();
}
function closePause(){ G.paused = false; $('pause').hidden = true; if (G.phase === 'idle') renderIdle(); }
function cancelRound(){
  clearTimers(); G.rid++;
  G.phase = 'idle'; G.ready = [false,false]; G.outcome = null;
  CH.forEach(resetCh); FX.length = 0;
  bothSig('HOLD UP', 'mid', 'cream', {pop:true});
  for (const p of [0,1]) setSub(p, 'ROUND CANCELLED. NO POINTS. READY UP AGAIN.');
  renderIdle();
  announce('Round cancelled.');
}
function pressReady(p){
  if (G.phase !== 'idle' || G.paused || G.ready[p] || performance.now() < G.lockUntil) return;
  G.ready[p] = true; Sound.ready();
  renderIdle(); tryStart();
}
function tryStart(){
  if (G.phase !== 'idle' || G.paused || !G.ready[0] || !G.ready[1]) return;
  if (active.size || keysHeld.size){ renderIdle(); return; }
  startCountdown();
}
function startCountdown(){
  clearTimers(); G.rid++;
  G.phase = 'countdown'; G.shots = [null,null]; G.signalTime = null; G.outcome = null; G.sparkDone = false; G.lateOK = false;
  CH.forEach(resetCh); FX.length = 0;
  for (const p of [0,1]){ showBtn(p,null); showChip(p,false); setSub(p,''); }
  const d = () => rand(600,1300);
  const step = n => { bothSig(String(n), 'big', 'white', {pop:true}); Sound.tick(); announce(String(n)); };
  step(3);
  later(d(), () => { step(2);
    later(d(), () => { step(1);
      later(d(), () => {
        G.phase = 'wait'; bothSig('STEADY...', 'mid', 'cream', {pop:true, breathe:true});
        later(rand(800,3000), armDraw);
      });
    });
  });
}
function armDraw(){
  const id = G.rid;
  requestAnimationFrame(() => {
    if (id !== G.rid || G.phase !== 'wait') return;
    G.phase = 'draw'; G.drawSetAt = performance.now();
    bothSig('DRAW!', 'big', 'gold', {pop:true, fast:true});
    Sound.draw(); flashAt = G.drawSetAt; announce('Draw!');
    // The next frame's timestamp marks when the frame showing DRAW! reached the screen.
    requestAnimationFrame(ts => {
      if (id !== G.rid) return;
      G.signalTime = Math.max(ts, G.drawSetAt);
      process();
      later(Math.max(0, G.signalTime + NO_SHOT_MS - performance.now()), () => { if (G.phase === 'draw' && !G.outcome) noShot(); });
    });
  });
}
function input(p, t){
  switch (G.phase){
    case 'countdown': case 'wait': G.shots[p] = t; falseStart(p); break;
    case 'draw':

/* ================= update ================= */
const HAND_BEND = {x:-9.5, y:3.5, z:4};
function update(now, dt){
  const tense = ACTIVE();
  for (const ch of CH){
    ch.bob = Math.sin(now/1000*1.8 + ch.ph) > .35 ? 1 : 0;
    ch.crouch = tense ? 1 : 0;
    if (now > ch.nTw){ ch.twAt = now; ch.nTw = now + rand(tense?450:1500, tense?1700:4500); }
    ch.tw = (now - ch.twAt) < 200 ? 1 : 0;
    if (now > ch.nEye){ ch.eye = [-1,0,0,1][(Math.random()*4)|0]; ch.nEye = now + rand(600,2400); }
    if (ch.fireAt && !ch.fired && now >= ch.fireAt + 75 && (ch.fumble || G.outcome)) doFire(ch, now);
    if (ch.cheer && now > ch.nCheer){ ch.hops.push({t:now, dur:360, amp:4}); ch.nCheer = now + rand(900,1500); }
    const h = ch.hat;
    if (h && !h.landed){
      h.vz -= 150*dt; h.x += h.vx*dt; h.y += h.vy*dt; h.z += h.vz*dt; h.rot += h.vr*dt;
      if (h.z <= 0){ h.z = 0; if (h.vz < -28){ h.vz *= -.3; h.vx *= .45; h.vy *= .45; h.vr *= .4; } else { h.landed = true; h.rot = 0; } }
    }
    if (ch.hatOff && h && h.landed && !ch.pick && ch.pickReadyAt && now >= ch.pickReadyAt && !(ch.hitAt && now < ch.getUpAt + 360)){
      ch.pick = {t0:now, fx:h.x, fy:h.y};
    }
    if (ch.pick && now - ch.pick.t0 >= 600){ ch.pick = null; ch.hatOff = false; ch.hat = null; ch.pickReadyAt = 0; ch.hitAt = 0; Sound.pickup(); }
    ch.hops = ch.hops.filter(o => now < o.t + o.dur + 50);
  }
  for (const e of FX) if (e.t === 'call' && !e.done && now >= e.at){ e.done = true; e.fn(now); }
  for (let i = FX.length-1; i >= 0; i--){ const e = FX[i]; if ((e.t === 'call' && e.done) || (e.t !== 'call' && now > e.t0 + e.dur)) FX.splice(i,1); }
  if (!TW.on && now > TW.next){
    const dir = Math.random() < .5 ? 1 : -1;
    Object.assign(TW, {on:true, dir, x: dir > 0 ? -30 : W + 30, y: rand(H*.1, H*.9), sp: rand(50,90), rot:0, ph:0});
  }
  if (TW.on){
    TW.x += TW.dir*TW.sp*dt; TW.rot += TW.dir*dt*TW.sp/(S*9); TW.ph += dt*5.5;
    if (TW.x < -40 || TW.x > W + 40){ TW.on = false; TW.next = now + rand(10000,24000); }
  }
}

/* ================= render ================= */
function drawStar(x, y, r, col){

  ctx.fillRect(Math.round(x-r/3), Math.round(y-r), Math.round(r*2/3), Math.round(r*2));

const snap = v => Math.round(v*DPR)/DPR;
function hatPos(ch, now){

    const t = now - ch.pick.t0, head = {x:0, y:0, z:HAT_Z};
    if (t < 80) return {x:ch.pick.fx, y:ch.pick.fy, z:0, rot:0};
    if (t < 320){ const u = ease(clamp01((t-80)/220)); return {x:ch.pick.fx + (HAND_BEND.x - ch.pick.fx)*u, y:ch.pick.fy + (HAND_BEND.y - ch.pick.fy)*u, z:HAND_BEND.z*u, rot:0}; }
    const u = ease(clamp01((t-320)/280));
    return {x:HAND_BEND.x + (head.x - HAND_BEND.x)*u, y:HAND_BEND.y + (head.y - HAND_BEND.y)*u, z:HAND_BEND.z + (head.z + 2 - HAND_BEND.z)*u + Math.sin(u*Math.PI)*8, rot:0};

}

    } else if (e.t === 'bang'){
      const img = renderText('BANG!', {P:Math.max(2, Math.round(S*.75*DPR)), bold:true, depth:2, o:1, face:PAL.gold.face, side:PAL.gold.side, outline:PAL.gold.outline});
      const sc = u < .18 ? .5 + u/.18*.65 : u < .3 ? 1.15 - (u-.18)/.12*.15 : 1;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.scale(sc, sc);
      ctx.globalAlpha = u > .7 ? (1-u)/.3 : 1;
      ctx.drawImage(img, -img.width/DPR/2, -img.height/DPR/2, img.width/DPR, img.height/DPR);
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (e.t === 'spark'){
      const r = S*(2 + u*11);
      ctx.globalAlpha = 1 - u; ctx.strokeStyle = '#fff6c0'; ctx.lineWidth = Math.max(2, S*.6);
      ctx.strokeRect(Math.round(e.x - r), Math.round(e.y - r*.6), Math.round(r*2), Math.round(r*1.2));
      drawStar(e.x, e.y, S*3.6*(1 - u*.5), '#ffffff'); ctx.globalAlpha = 1;
    } else if (e.t === 'ripple'){
      const r = 10 + u*34;
      ctx.globalAlpha = (1-u)*.85; ctx.strokeStyle = LOOK[e.p].accent; ctx.lineWidth = 3;
      ctx.strokeRect(Math.round(e.x - r), Math.round(e.y - r*.62), Math.round(r*2), Math.round(r*1.24)); ctx.globalAlpha = 1;
    }
  }
  ctx.fillStyle = 'rgba(255,246,222,.45)';
  for (const m of MOTES){
    m.x += m.vx/60; if (m.x > 1.05) m.x = -.05;
    const y = (m.y + Math.sin(now/1500 + m.ph)*.01)*H;
    ctx.fillRect(Math.round(m.x*W), Math.round(y), m.s*2, m.s*2);
  }
  const fu = (now - flashAt)/200;
  if (fu >= 0 && fu < 1){ ctx.fillStyle = `rgba(255,248,220,${.22*(1-fu)})`; ctx.fillRect(-10,-10,W+20,H+20); }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - lastT)/1000)); lastT = now;
  update(now, dt);
  render(now);
  refreshBanner();
}

/* ================= boot ================= */
layout();
paintStatic();
requestAnimationFrame(frame);
window.__qd = {G, CH, SPR, APP_VERSION, art:{charModel, spriteOf, LOOK, VK, unVK}};
})();
</script>
